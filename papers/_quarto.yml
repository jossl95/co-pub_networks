project:
  type: default
  render: 
    - "paper1.qmd"
  output-dir: _output    # <-- all rendered files go here

execute:
  freeze: auto

bibliography: assets/references.bib
csl: assets/asa.csl

format:
  hikmah-pdf:
    papersize: a4
    geometry:
      - top=25mm
      - left=25mm
      - bottom=25mm
      - right=25mm
    number-sections: true
    number-depth: 3
  docx:
    papersize: a4
